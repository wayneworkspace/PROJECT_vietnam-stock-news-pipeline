services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest   # nên ghim số phiên bản sau khi chạy ổn
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Bangkok
      - TZ=Asia/Bangkok
      - N8N_RUNNERS_ENABLED=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/data   # cho node đọc file JSON ở /data để up Drive
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data
    depends_on:
      - pyworker

  pyworker:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-pyworker:local
    container_name: pyworker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # chỉ máy bạn gọi được; n8n gọi http://pyworker:8000
    env_file:
      - .env
    environment:
      - DUCKDB_PATH=/data/stock.duckdb
      - RAW_DIR=/data/bronze/json
    volumes:
      - ./python:/app
      - ./data:/data

volumes:
  n8n_data:
